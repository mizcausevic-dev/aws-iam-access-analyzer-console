name: Build verification

# BUILD ONLY. This workflow does not deploy.
#
# Deployment to aws.kineticgain.com is manual, over SSH/SFTP on port 65002 to
# the Hostinger web estate. The GitHub Pages deploy that used to live here was
# removed 2026-08-20. Unlike its sibling repos this one never used FTP - it
# published to GitHub Pages - but it was the same class of problem, and arguably
# worse because it was green the whole time:
#
#   1. Pages was never actually serving this domain. aws.kineticgain.com
#      resolves to Hostinger (Server: hcdn, verified 2026-08-20), so every
#      "successful" Pages deploy published to a surface nobody reads while the
#      real page came from somewhere else entirely. A green check that moves
#      nothing is worse than a red one.
#   2. It raced the SSH path in principle, and the trigger made that worse:
#      pages.yml fired on push to `main` while this repo's working branch is
#      `project/aws-iam-access-analyzer-console`, so the two paths could publish
#      different commits with no relationship to each other.
#   3. robots.txt/sitemap.xml were generated by inline shell here rather than by
#      the build, so any deploy that bypassed this exact job shipped without
#      them. That generation now lives in scripts/prerender.ts, where every
#      build path picks it up.
#
# The Pages custom-domain claim on aws.kineticgain.com is a separate open item,
# tracked outside this file: GitHub still holds the claim, its ACME certificate
# authorization is in a bad state, and it cannot resolve while DNS points at
# Hostinger.

on:
  push:
    branches: [main, "project/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-aws-iam-access-analyzer-console
  cancel-in-progress: true

jobs:
  build:
    name: Build + verify output
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run prerender

      - name: Verify build output
        run: |
          test -f site/index.html   || (echo "FAIL: site/index.html missing" && exit 1)
          test -f site/CNAME        || (echo "FAIL: site/CNAME missing" && exit 1)
          test -f site/favicon.svg  || (echo "FAIL: site/favicon.svg missing" && exit 1)
          test -f site/robots.txt   || (echo "FAIL: site/robots.txt missing (prerender.ts should emit it)" && exit 1)
          test -f site/sitemap.xml  || (echo "FAIL: site/sitemap.xml missing (prerender.ts should emit it)" && exit 1)
          grep -q "application/ld+json" site/index.html || \
            (echo "FAIL: JSON-LD block missing" && exit 1)
          grep -qi "#0B0C10" site/index.html || \
            (echo "FAIL: canonical BERT ground #0B0C10 not present in build" && exit 1)
          echo "OK: build verified"
          ls -lah site/

      # No deploy step, and deliberately no live-site check either. A curl
      # against the production URL from here would report on whatever the last
      # SSH deploy put there, not on the commit this run just built - a green
      # check that proves nothing about this build. Verifying the artifact
      # above is the honest boundary of what a build job can assert.
